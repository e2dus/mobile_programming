name: individual_project
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  visibility_detector: ^0.4.0
  video_player: ^2.8.1
  video_thumbnail: ^0.5.6
  collection: ^1.19.1
  google_generative_ai: ^0.4.7
  intl: ^0.20.2
  photo_manager: ^3.7.1
  photo_manager_image_provider: ^2.2.0
  flutter_screenutil: ^5.9.0
  path_provider: ^2.0.14
  cached_network_image: ^3.3.1
  supabase_flutter: ^2.10.3
  image_picker: ^1.0.4
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/ic_instagram.svg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/icons/ic_instagram.svg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/ic_instagram.svg"